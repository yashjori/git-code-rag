[project]
name = "git-code-assistant"
version = "0.1.0"
description = "RAG-based code assistant for GitHub and Azure DevOps repositories, backed by Qdrant Cloud and Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-text-splitters>=0.3.2",
    "langgraph>=0.2.45",
    "langchain-groq>=0.2.1",
    "qdrant-client>=1.12.0",
    "gitpython>=3.1.43",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
