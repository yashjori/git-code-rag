# Auth is fully backend-owned now (HttpOnly session cookie + FastAPI
# dependency) - nginx's only job is TLS termination, static file serving,
# and reverse-proxying to the backend. No auth_basic here.

server {
    listen 80;
    server_name 100-61-92-68.sslip.io;

    # Matched before the redirect below so Let's Encrypt renewals (which
    # use this same webroot path) keep working without touching this file
    # again.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 100-61-92-68.sslip.io;

    ssl_certificate /etc/letsencrypt/live/100-61-92-68.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/100-61-92-68.sslip.io/privkey.pem;

    # Repository indexing (clone + chunk + embed + store) can legitimately
    # take longer than nginx's 60s default for larger repositories.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
